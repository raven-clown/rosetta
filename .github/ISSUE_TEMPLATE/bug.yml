name: Bug
description: Something doesn't work the way the docs say.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rosetta version`, or the commit you built.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest config and steps that show it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens and other secrets first.
      render: text
